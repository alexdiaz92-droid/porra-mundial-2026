<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolilla Opi Mundial 2026</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#fff; --bg2:#f8f9fa; --bg3:#f0f2f5; --text:#1a1a2e; --text2:#555577; --text3:#999; --border:rgba(0,0,0,0.09); --border2:rgba(0,0,0,0.16); --r:8px; --rl:14px; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141418; --bg2:#1e1e26; --bg3:#252530; --text:#eeeef5; --text2:#9999bb; --text3:#55556f; --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.15); }
      .gm{background:#78350f;color:#fef3c7}.sm{background:#374151;color:#e2e8f0}.bm{background:#7c2d12;color:#fde8d8}
      .vivo{background:#14532d;color:#86efac}
    }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg3); color:var(--text); min-height:100vh; }
    .app { max-width:920px; margin:0 auto; padding:2rem 1rem 4rem; }
    .hdr { text-align:center; margin-bottom:1.75rem; }
    .hdr h1 { font-size:26px; font-weight:700; letter-spacing:-0.4px; }
    .hdr p { color:var(--text2); font-size:13px; margin-top:5px; }
    .card { background:var(--bg); border-radius:var(--rl); border:1px solid var(--border); overflow:hidden; box-shadow:0 2px 14px rgba(0,0,0,0.06); }
    .tabs { display:flex; flex-wrap:wrap; gap:2px; padding:10px 10px 0; background:var(--bg2); border-bottom:1px solid var(--border); }
    .tab { padding:7px 13px; border-radius:var(--r) var(--r) 0 0; border:1px solid transparent; border-bottom:none; cursor:pointer; font-size:12px; color:var(--text2); background:none; display:flex; align-items:center; gap:5px; position:relative; bottom:-1px; transition:all 0.12s; }
    .tab:hover { color:var(--text); background:var(--bg); }
    .tab.active { color:var(--text); background:var(--bg); border-color:var(--border); font-weight:600; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; padding:9px 16px; border-bottom:1px solid var(--border); }
    .live { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text2); }
    .dot { width:7px; height:7px; border-radius:50%; background:#22c55e; flex-shrink:0; }
    .btn { display:flex; align-items:center; gap:5px; padding:5px 12px; border-radius:var(--r); border:1px solid var(--border2); background:none; cursor:pointer; font-size:12px; color:var(--text2); transition:all 0.12s; }
    .btn:hover { background:var(--bg2); color:var(--text); }
    .panel { display:none; } .panel.active { display:block; }
    .tbl-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead tr { background:var(--bg2); border-bottom:1px solid var(--border2); }
    th { padding:8px 14px; font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; text-align:left; white-space:nowrap; }
    th.r { text-align:right; }
    td { padding:11px 14px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; }
    td.r { text-align:right; font-variant-numeric:tabular-nums; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover { background:var(--bg2); }
    .medal { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; font-size:12px; font-weight:700; }
    .gm{background:#fef3c7;color:#78350f}.sm{background:#e2e8f0;color:#374151}.bm{background:#fde8d8;color:#7c2d12}
    .pn{color:var(--text3);font-size:12px;display:inline-block;width:26px;text-align:center}
    .name{font-weight:600}.pts{font-size:17px;font-weight:700}.pts0{color:var(--text3)}
    .pts-det{font-size:11px;color:var(--text3);margin-left:3px}
    .flag{font-size:15px;margin-right:7px;vertical-align:middle}
    .footer{padding:9px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
    .loading{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:13px}
    .loading i{font-size:26px;display:block;margin-bottom:8px;animation:spin 1s linear infinite}
    .err{text-align:center;padding:2rem 1rem;color:var(--text2);font-size:13px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .resumen-table th, .resumen-table td { padding:10px 10px; }
    .resumen-table { table-layout:fixed; width:100%; }
    .pts-det { font-size:11px; color:rgba(255,255,255,0.85); margin-left:3px; }
    .pts-det-plain { font-size:11px; color:var(--text3); margin-left:3px; }
    .flag { font-size:15px; margin-right:7px; vertical-align:middle; }
    .selecc-wrap { overflow-x:auto; position:relative; }
    .selecc-table { border-collapse:collapse; font-size:13px; width:100%; }
    .selecc-table th, .selecc-table td { padding:8px 12px; white-space:nowrap; border-bottom:1px solid var(--border); }
    .selecc-table thead tr { background:var(--bg2); border-bottom:1px solid var(--border2); }
    .selecc-table th { font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; }
    .selecc-table tbody tr:hover { background:var(--bg2); }
    .selecc-table tbody tr:last-child td { border-bottom:none; }
    .col-sticky-l { position:sticky; left:0; background:var(--bg); z-index:2; border-right:1px solid var(--border2); }
    .col-sticky-r { position:sticky; right:0; background:var(--bg); z-index:2; border-left:1px solid var(--border2); text-align:right; font-weight:700; }
    .selecc-table thead .col-sticky-l,
    .selecc-table thead .col-sticky-r { background:var(--bg2); }
    .selecc-table tbody tr:hover .col-sticky-l,
    .selecc-table tbody tr:hover .col-sticky-r { background:var(--bg2); }

    .detalle-wrap { overflow-x:auto; position:relative; }
    .detalle-table { border-collapse:collapse; font-size:13px; width:100%; }
    .detalle-table th, .detalle-table td { padding:8px 14px; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
    .detalle-table thead tr { background:var(--bg2); border-bottom:1px solid var(--border2); }
    .detalle-table th { font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; text-align:left; }
    .detalle-table td.r, .detalle-table th.r { text-align:right; }
    .detalle-table tbody tr:hover { background:var(--bg2); }
    .detalle-table tbody tr:last-child td { border-bottom:none; };

const URLS = {
  general:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8r4B2aUnREShzVkZseQYuO28SjFsf6qpQZy2WROipf3MFozOdfGSHgBJx03u-Dks_AXL4WR_GJ2At/pub?gid=464164987&single=true&output=csv',
  resumen:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8r4B2aUnREShzVkZseQYuO28SjFsf6qpQZy2WROipf3MFozOdfGSHgBJx03u-Dks_AXL4WR_GJ2At/pub?gid=0&single=true&output=csv',
  detalle:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8r4B2aUnREShzVkZseQYuO28SjFsf6qpQZy2WROipf3MFozOdfGSHgBJx03u-Dks_AXL4WR_GJ2At/pub?gid=1171356781&single=true&output=csv',
  selecc:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8r4B2aUnREShzVkZseQYuO28SjFsf6qpQZy2WROipf3MFozOdfGSHgBJx03u-Dks_AXL4WR_GJ2At/pub?gid=159607314&single=true&output=csv',
  goleadores:'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8r4B2aUnREShzVkZseQYuO28SjFsf6qpQZy2WROipf3MFozOdfGSHgBJx03u-Dks_AXL4WR_GJ2At/pub?gid=538522937&single=true&output=csv',
  premios:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8r4B2aUnREShzVkZseQYuO28SjFsf6qpQZy2WROipf3MFozOdfGSHgBJx03u-Dks_AXL4WR_GJ2At/pub?gid=844381625&single=true&output=csv',
  clasif:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8r4B2aUnREShzVkZseQYuO28SjFsf6qpQZy2WROipf3MFozOdfGSHgBJx03u-Dks_AXL4WR_GJ2At/pub?gid=464164987&single=true&output=csv',
};

function fetch_(url){return new Promise((res,rej)=>Papa.parse(url,{download:true,skipEmptyLines:false,complete:r=>res(r.data),error:rej}));}
function pc(i,l){if(i===0)return'<span class="medal gm">1</span>';if(i===1)return'<span class="medal sm">2</span>';if(i===2)return'<span class="medal bm">3</span>';return`<span class="pn">${l}</span>`;}

const TABS=[
  {label:'Clasificación',icon:'ti-trophy'},{label:'Resumen',icon:'ti-list'},
  {label:'Detalle',icon:'ti-zoom-in'},{label:'Selecciones',icon:'ti-flag'},
  {label:'Goleadores',icon:'ti-ball-football'},{label:'Premios',icon:'ti-medal'},
];
let active=0;

function buildTabs(){
  const tc=document.getElementById('tabs');tc.innerHTML='';
  TABS.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===active?' active':'');
    b.innerHTML=`<i class="ti ${t.icon}" aria-hidden="true"></i>${t.label}`;
    b.onclick=()=>{active=i;document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',j===i));document.querySelectorAll('.panel').forEach((x,j)=>x.classList.toggle('active',j===i));};
    tc.appendChild(b);
  });
}

function renderGeneral(data){
  const players=[];
  let lu='';
  data.forEach(r=>{
    if(r.join('').includes('Última Actualización')){lu=r[5]||'';return;}
    if(!r[2]||!r[1]||!r[1].includes('º'))return;
    players.push({nombre:r[2].trim(),pts:parseFloat((r[3]||"0").replace(",","."))||0});
  });
  players.sort((a,b)=>b.pts-a.pts);
  if(lu)document.getElementById('footer').textContent=`Última actualización: ${lu}`;
  document.getElementById('sub').textContent=`${players.length} participantes · Mundial 2026`;
  let h='<div class="tbl-wrap"><table><thead><tr><th style="width:46px">#</th><th>Participante</th><th class="r">Puntos</th></tr></thead><tbody>';
  players.forEach((p,i)=>{
    const badge=i<7?' 🍗🍺':' 💰';
    h+=`<tr><td>${pc(i,(i+1)+'º')}</td><td><span class="name">${p.nombre}</span><span style="font-size:14px">${badge}</span></td><td class="r"><span class="${p.pts===0?'pts pts0':'pts'}">${p.pts}</span></td></tr>`;
  });
  return h+'</tbody></table></div>';
}

function renderResumen(data){
  const rows=data.filter(r=>r[1]&&r[1].trim()&&r[2]!=='SELECCIONES'&&r[1]!=='');
  rows.sort((a,b)=>(parseFloat(b[5].replace(",","."))||0)-(parseFloat(a[5].replace(",","."))||0));
  let h='<div class="tbl-wrap"><table class="resumen-table"><thead><tr><th></th><th class="r">🌍</th><th class="r">⚽</th><th class="r">🏆</th><th class="r">Total</th></tr></thead><tbody>';
  rows.forEach(r=>h+=`<tr><td class="name">${r[1]}</td><td class="r">${r[2]||0}</td><td class="r">${r[3]||0}</td><td class="r">${r[4]||0}</td><td class="r"><strong>${r[5]||0}</strong></td></tr>`);
  return h+'</tbody></table></div>';
}

function renderDetalle(data, vivoSel, vivoGol){
  // Detectar participantes con datos: buscar columnas con nombre en fila cabecera
  const header=data[0]||[];
  // Nombres en cols 2,5,8,11... (cada 3)
  const parts=[];
  for(let c=2;c<header.length;c+=3){if(header[c]&&header[c].trim())parts.push({name:header[c].trim(),col:c});}

  const catRows=data.filter(r=>r[0]&&r[0].trim()&&r[0]!=='CATEGORÍA'&&r[1]&&r[1].trim());
  let h='<div class="detalle-wrap"><table class="detalle-table"><thead><tr><th>Categoría</th><th class="r">Mult.</th>';
  parts.forEach(p=>h+=`<th class="r" style="font-size:11px">${p.name}</th>`);
  h+='</tr></thead><tbody>';
  catRows.forEach(r=>{
    const cat=r[0];
    const mult=r[1];
    const tipo=cat.toLowerCase().includes('goleador')?'gol':cat.toLowerCase().includes('equipo')||cat.toLowerCase().includes('peor')?'sel':'pre';
    h+=`<tr><td style="font-size:13px;white-space:nowrap">${cat}</td><td class="r" style="color:var(--text2);font-size:12px">${mult}</td>`;
    parts.forEach(p=>{
      const apuesta=r[p.col]||'';
      const pts=r[p.col+1]||'0';
      if(!apuesta){h+=`<td class="r"></td>`;return;}
      const vivo=tipo==='sel'?vivoSel.has(apuesta):tipo==='gol'?vivoGol.has(apuesta):false;
      const bg=vivo?'background:#93c47d;':'';
      h+=`<td class="r" style="font-size:12px;${bg}white-space:nowrap">${apuesta}<span class="pts-det">(${pts})</span></td>`;
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

function renderSelecc(data){
  const header=data[0]||[];
  const rows=data.slice(1).filter(r=>r[0]&&r[0].trim());
  // Última col numérica es Total (antes de "Sigue en liza?")
  rows.sort((a,b)=>(parseFloat(b[b.length-2])||0)-(parseFloat(a[a.length-2])||0));
  const midHeaders=header.slice(1,-2); // excluir primera col, Total y "Sigue en liza?"
  let h='<div class="selecc-wrap"><table class="selecc-table"><thead><tr>';
  h+=`<th class="col-sticky-l">Selección</th>`;
  midHeaders.forEach(c=>h+=`<th class="r" style="font-size:10px">${c}</th>`);
  h+=`<th class="col-sticky-r">Total</th>`;
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    const flag=FLAGS[r[0]]||'';
    const total=r[r.length-2]||'0';
    const mid=r.slice(1,-2);
    h+=`<tr><td class="col-sticky-l"><span class="flag">${flag}</span><span class="name">${r[0]}</span></td>`;
    mid.forEach(v=>h+=`<td class="r" style="color:var(--text2)">${v||'–'}</td>`);
    h+=`<td class="col-sticky-r">${total}</td>`;
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

function renderGoleadores(data){
  const rows=data.filter(r=>r[0]&&r[0].trim()&&r[0]!=='Jugador');
  rows.sort((a,b)=>(parseFloat(b[1])||0)-(parseFloat(a[1])||0));
  let h='<div class="tbl-wrap"><table><thead><tr><th style="width:46px">#</th><th>Jugador</th><th class="r">Goles</th></tr></thead><tbody>';
  rows.forEach((r,i)=>h+=`<tr><td>${pc(i,(i+1)+'º')}</td><td class="name">${r[0]}</td><td class="r"><span class="${(parseFloat(r[1])||0)===0?'pts pts0':'pts'}">${r[1]||0}</span></td></tr>`);
  return h+'</tbody></table></div>';
}

function renderPremios(data){
  const cats=['Balón de Oro','Mejor Jugador Joven','Guante de Oro'];
  const blocks=[[],[],[]];
  data.slice(2).forEach(r=>{
    if(r[0]&&r[0].trim())blocks[0].push({j:r[0],p:parseFloat(r[1])||0});
    if(r[3]&&r[3].trim())blocks[1].push({j:r[3],p:parseFloat(r[4])||0});
    if(r[6]&&r[6].trim())blocks[2].push({j:r[6],p:parseFloat(r[7])||0});
  });
  blocks.forEach(b=>b.sort((a,c)=>c.p-a.p));
  const maxRows=Math.max(...blocks.map(b=>b.length));
  let h='<div class="tbl-wrap"><table><thead><tr>';
  cats.forEach(c=>h+=`<th>${c}</th><th class="r">Pts</th><th style="width:16px"></th>`);
  h+='</tr></thead><tbody>';
  for(let i=0;i<maxRows;i++){
    h+='<tr>';
    blocks.forEach(b=>{
      const e=b[i]||{j:'',p:''};
      h+=`<td>${e.j}</td><td class="r">${e.j?e.p:''}</td><td></td>`;
    });
    h+='</tr>';
  }
  return h+'</tbody></table></div>';
}


async function loadAll(){
  document.getElementById('upd').textContent='Actualizando...';
  buildTabs();
  const pc2=document.getElementById('panels');pc2.innerHTML='';
  TABS.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='panel'+(i===active?' active':'');
    d.id=`p${i}`;
    d.innerHTML=`<div class="loading"><i class="ti ti-loader-2"></i>Cargando ${t.label}...</div>`;
    pc2.appendChild(d);
  });

  try{
    // Cargar en paralelo
    const [dataClasif, dataResumen, dataDetalle, dataSelecc, dataGol, dataPremios] = await Promise.all([
      fetch_(URLS.clasif), fetch_(URLS.resumen), fetch_(URLS.detalle),
      fetch_(URLS.selecc), fetch_(URLS.goleadores), fetch_(URLS.premios)
    ]);

    // Construir sets de vivos desde Selecciones y Goleadores
    const vivoSel=new Set();
    dataSelecc.slice(1).forEach(r=>{if(r[0]&&r[r.length-1]==='Sí')vivoSel.add(r[0].trim());});
    const vivoGol=new Set();
    dataGol.slice(1).forEach(r=>{if(r[0]&&r[r.length-1]==='Sí')vivoGol.add(r[0].trim());});

    const renders=[
      renderGeneral(dataClasif),
      renderResumen(dataResumen),
      renderDetalle(dataDetalle, vivoSel, vivoGol),
      renderSelecc(dataSelecc),
      renderGoleadores(dataGol),
      renderPremios(dataPremios),
    ];
    renders.forEach((html,i)=>{const p=document.getElementById(`p${i}`);if(p)p.innerHTML=html;});
  }catch(e){
    TABS.forEach((_,i)=>{const p=document.getElementById(`p${i}`);if(p)p.innerHTML=`<div class="err"><i class="ti ti-wifi-off" style="display:block;font-size:22px;margin-bottom:8px"></i>Error al cargar los datos</div>`;});
  }

  const now=new Date();
  document.getElementById('upd').textContent=`Actualizado ${now.toLocaleTimeString('es-ES')}`;
}

loadAll();
</script>
</body>
</html>
